# Railway Configuration for CCI Department Guidance System
# This tells Railway to deploy the backend service

[build]
builder = "nixpacks"
buildCommand = "cd backend && npm install --production"

[deploy]
startCommand = "cd backend && node src/server.js"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

# Health check configuration
[deploy.healthcheckPath]
path = "/api/health"
